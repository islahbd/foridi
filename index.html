  .ff{position:fixed;inset:0;z-index:3;pointer-events:none;transition:opacity .8s}
  .ff b{position:absolute;width:var(--z,4px);height:var(--z,4px);border-radius:50%;background:#ffe3a0;box-shadow:0 0 10px 4px rgba(255,200,90,.65);animation:fd var(--t,12s) ease-in-out infinite alternate,fp var(--p,3s) ease-in-out infinite alternate}
  @keyframes fd{from{translate:0 0}to{translate:var(--x,40px) var(--y,-70px)}}@keyframes fp{from{opacity:.15}to{opacity:.95}}
  .shoot{position:absolute;width:150px;height:2px;border-radius:2px;background:linear-gradient(90deg,transparent,#fff);opacity:0;animation:sh 13s linear infinite;animation-delay:var(--l,3s)}
  @keyframes sh{0%{opacity:0;transform:translate(0,0) rotate(24deg)}1.5%{opacity:1}6%{opacity:0;transform:translate(-460px,210px) rotate(24deg)}100%{opacity:0}}
  .mfill{position:absolute;left:0;width:100%;bottom:0;background:#10143a}
  .hero{position:fixed;left:50%;top:max(12vh,5.5rem);transform:translateX(-50%);text-align:center;width:90vw;max-width:30rem;pointer-events:none;z-index:3}
  h1{font-family:"Fraunces",Georgia,serif;font-weight:500;font-size:clamp(3.6rem,13vw,6.5rem);line-height:1;margin:0 0 .8rem;text-shadow:0 4px 30px rgba(0,0,0,.5)}
  .dots5{display:flex;gap:7px;justify-content:center;margin:0 0 .9rem}.dots5 i{width:5px;height:5px;border-radius:50%;background:var(--red)}
  .sub{font-size:1.15rem;line-height:1.4;margin:0;color:#eae8f5}
  .hint{position:fixed;left:50%;bottom:calc(1.4rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:5;font-size:.85rem;letter-spacing:.08em;color:#dfe3f5;text-align:center}
